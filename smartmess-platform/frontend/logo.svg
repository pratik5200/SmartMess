<svg xmlns="http://www.w3.org/2000/svg" width="560" height="540" viewBox="0 0 560 540">
  <title>SmartMess leaf bowl logo</title>
  <desc>Vector recreation of the provided green leaves and dark brown bowl mark.</desc>
  <rect width="560" height="540" fill="none"/>
  <!-- Large upright leaf -->
  <path d="M244 266
           C211 223 210 169 234 113
           C255 65 292 35 334 28
           C341 79 334 135 308 182
           C291 213 268 241 244 266 Z"
        fill="#8BA95C"/>
  <path d="M245 258 C249 207 272 153 306 91"
        fill="none" stroke="#F7F5ED" stroke-width="7"
        stroke-linecap="round"/>
  <!-- Small left leaf -->
  <path d="M226 260
           C185 258 149 239 126 207
           C111 185 106 160 108 139
           C145 141 177 158 198 185
           C215 207 224 234 226 260 Z"
