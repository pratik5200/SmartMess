  <!-- subtle warm lower bowl accent -->
  <path d="M132 318
           C158 367 208 399 280 407
           C352 399 402 367 428 318"
        fill="none" stroke="#32190F" stroke-width="8"
        stroke-linecap="round"/>
</svg>
