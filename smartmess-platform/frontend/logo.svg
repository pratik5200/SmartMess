  <path d="M220 253 C192 220 166 192 137 170"
        fill="none" stroke="#F7F5ED" stroke-width="6.5"
        stroke-linecap="round"/>
  <!-- Curved stem / right-hand branch -->
  <path d="M266 266
           C286 226 314 193 352 171
           C377 156 403 146 425 132"
        fill="none" stroke="#32190F" stroke-width="19"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bowl rim -->
  <path d="M84 282
           C84 276 89 272 96 272
           H451
           C459 272 464 278 461 286
           L444 321
           C419 374 364 418 280 427
           C196 418 141 374 116 321 Z"
